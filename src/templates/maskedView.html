<!DOCTYPE html>
<html lang="{{LANGUAGE}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Masked File</title>
    <style>
        body {
            font-family: var(--vscode-font-family);
            padding: 20px;
            margin: 0;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground)
        }

        .container {
            max-width: 600px;
            margin: 0 auto
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 16px;
            text-align: center
        }

        h1 {
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--vscode-errorForeground);
            font-weight: 600;
            text-align: center
        }

        .file-info {
            margin: 16px 0;
            padding: 12px;
            background: var(--vscode-editor-inactiveSelectionBackground);
            border-radius: 4px
        }

        .file-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            word-break: break-all
        }

        .file-stats {
            font-size: 12px;
            color: var(--vscode-descriptionForeground)
        }

        .warning-text {
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.5
        }

        .action-section {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .action-card {
            padding: 16px;
            border-radius: 4px;
            border: 1px solid
        }

        .action-card.primary {
            border-color: var(--vscode-button-background);
            background: rgba(14, 99, 156, 0.1)
        }

        .action-card.secondary {
            border-color: var(--vscode-inputValidation-warningBorder);
            background: var(--vscode-inputValidation-warningBackground)
        }

        .action-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 600
        }

        .action-card p {
            margin: 0 0 12px 0;
            font-size: 13px;
            line-height: 1.4
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
            padding: 8px;
            border-radius: 4px
        }

        .checkbox-container:hover {
            background: rgba(255, 255, 255, 0.05)
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer
        }

        .checkbox-container label {
            cursor: pointer;
            font-size: 13px
        }

        button {
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            width: 100%
        }

        .btn-primary {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground)
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--vscode-button-hoverBackground)
        }

        .btn-secondary {
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground)
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--vscode-button-secondaryHoverBackground)
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed
        }

        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            text-align: center
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="warning-icon">🔒</div>
        <h1>{{WARNING_MESSAGE}}</h1>

        <div class="file-info">
            <div class="file-name">📄 {{FILE_NAME}}</div>
            <div class="file-stats">{{LINE_COUNT}} {{LINES}} | {{FILE_SIZE}} {{BYTES}}</div>
        </div>

        <div class="warning-text">
            <strong>{{PROTECTED_BY_ALLOWLIST}}</strong><br>
            {{PROTECTED_DESCRIPTION}}
        </div>

        <div class="action-section">
            <div class="action-card primary">
                <h3>{{ADD_TO_ALLOWLIST_TITLE}}</h3>
                <p>{{ADD_TO_ALLOWLIST_DESC}}</p>
                <button class="btn-primary" onclick="addToAllowlist()">
                    {{ADD_TO_ALLOWLIST_BUTTON}}
                </button>
            </div>

            <div class="action-card secondary">
                <h3>{{TEMPORARY_SHOW_TITLE}}</h3>
                <p>{{TEMPORARY_SHOW_DESC}}</p>
                <div class="checkbox-container" onclick="document.getElementById('confirmCheck').click()">
                    <input type="checkbox" id="confirmCheck" onclick="event.stopPropagation(); updateButton()">
                    <label for="confirmCheck">{{CONFIRM_CHECKBOX}}</label>
                </div>
                <button id="revealButton" class="btn-secondary" disabled onclick="revealContent()">
                    {{REVEAL_BUTTON}}
                </button>
            </div>
        </div>

    </div>

    <script>
        (function () {
            const vscode = acquireVsCodeApi();

            window.updateButton = function () {
                const checkbox = document.getElementById('confirmCheck');
                const button = document.getElementById('revealButton');
                button.disabled = !checkbox.checked;
            };

            window.revealContent = function () {
                vscode.postMessage({
                    command: 'reveal'
                });
            };

            window.addToAllowlist = function () {
                vscode.postMessage({
                    command: 'addToAllowlist'
                });
            };

            // キーボードショートカット
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !document.getElementById('revealButton').disabled) {
                    revealContent();
                }
            });

            // Spaceキーでチェックボックスをトグル
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') {
                    e.preventDefault();
                    const checkbox = document.getElementById('confirmCheck');
                    checkbox.checked = !checkbox.checked;
                    updateButton();
                }
            });
        })();
    </script>
</body>

</html>
